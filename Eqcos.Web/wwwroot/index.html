<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Электронная очередь — КГАМТ</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <!-- шрифты как на сайте техникума -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="img/logo.png" />
    <link href="Eqcos.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Произошла ошибка.
        <a href="." class="reload">Обновить страницу</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
                // Enter в поле формы с классом eq-enter: перейти к следующему полю,
                // а в последнем поле — нажать кнопку с классом eq-submit
                document.addEventListener('keydown', function (e) {
                    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT')
                        return;
                    var box = e.target.closest('.eq-enter');
                    if (!box)
                        return;
                    e.preventDefault();
                    var fields = Array.from(box.querySelectorAll('input:not([type=checkbox]):not([disabled])'));
                    var i = fields.indexOf(e.target);
                    if (i < fields.length - 1) {
                        fields[i + 1].focus();
                        return;
                    }
                    e.target.blur();   // чтобы сайт успел запомнить, что введено в последнем поле
                    var button = box.querySelector('.eq-submit');
                    if (button)
                        button.click();
                });
    </script>
</body>

</html>
